name: Windows build and standalone test package

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore app/MediaPlayerPrj/MediaPlayerPrj.csproj
      - name: Build
        run: dotnet build app/MediaPlayerPrj/MediaPlayerPrj.csproj --configuration Release --no-restore
      - name: Verify library persistence and sorting
        run: dotnet test tests/LibraryTests/LibraryTests.csproj --configuration Release --verbosity minimal
      - name: Verify playback modes
        run: dotnet test tests/PlaybackModes.Tests/PlaybackModes.Tests.csproj --configuration Release --verbosity minimal
      - name: Verify favorites
        run: dotnet test tests/MitchelFavoritesTests/MitchelFavoritesTests.csproj --configuration Release --verbosity minimal
      - name: Publish self-contained win-x64
        run: dotnet publish app/MediaPlayerPrj/MediaPlayerPrj.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/AmazingPlayer -p:PublishSingleFile=false -p:PublishTrimmed=false
      - name: Verify publish content
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/AmazingPlayer/MediaPlayerPrj.exe")) { throw "MediaPlayerPrj.exe missing" }
          Get-ChildItem "publish/AmazingPlayer" | Select-Object Name
      - name: Verify skin assets in published app
        shell: pwsh
        run: |
          $required = @("cassette_art.png", "paper_texture.png", "logo.png", "logo.ico")
          foreach ($asset in $required) {
            $path = Join-Path "publish/AmazingPlayer/Assets" $asset
            if (-not (Test-Path $path)) { throw "Missing original asset: $asset" }
          }
      - name: Upload standalone test package
        uses: actions/upload-artifact@v4
        with:
          name: AmazingPlayer-integration-win-x64-self-contained
          path: publish/AmazingPlayer/
          if-no-files-found: error
          retention-days: 7
